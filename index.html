<!DOCTYPE html>
<html>
<head>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b3c5d">
<meta charset="UTF-8">
<title>Hotel Ravi Palace – Smart Booking</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="chatbot-tc.css">
<script src="chatbot-tc.js"></script>
<style>
:root{
  --bg:#0e0e0e;
  --card:#1a1a1a;
  --gold:#d4af37;
  --gold-dark:#b8962e;
  --text:#ffffff;
  --muted:#b5b5b5;
  --danger:#8b0000;
}

body{
  margin:0;
  font-family:Segoe UI,Arial;
  background:var(--bg);
  color:var(--text);
}

.app{
  max-width:420px;
  margin:auto;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  background:var(--bg);
<footer style="text-align:center;padding:15px;font-size:13px;color:#aaa;">
  <a href="/privacy-policy.html">Privacy Policy</a> |
  <a href="/chatbot-terms.html">Chatbot Terms & Conditions</a>
</footer>

}

/* HEADER */
.header{
  background:linear-gradient(135deg,#000,#1c1c1c);
  padding:14px;
  display:flex;
  gap:12px;
  align-items:center;
  border-bottom:1px solid #222;
}
.header img{
  height:42px;
  border-radius:6px;
  background:#fff;
}
.header b{font-size:16px}
.header small{color:var(--gold)}

/* CONTENT */
.content{
  flex:1;
  padding:18px;
  overflow-y:auto;
}

/* CARD */
.card{
  background:linear-gradient(180deg,#1c1c1c,#121212);
  padding:18px;
  border-radius:18px;
  box-shadow:0 10px 30px rgba(0,0,0,.6);
  margin-bottom:18px;
}

/* TEXT */
h3{
  margin:0 0 12px;
  color:var(--gold);
}
label{
  font-size:13px;
  color:var(--muted);
  margin-top:10px;
  display:block;
}
small{color:#aaa;font-size:12px}

/* INPUTS */
input,select{
  width:100%;
  padding:12px;
  margin-top:6px;
  border-radius:10px;
  border:1px solid #333;
  background:#0f0f0f;
  color:#fff;
}

/* ACTIONS */
.actions{
  display:flex;
  gap:12px;
  margin-top:16px;
}

/* BUTTONS */
button{
  flex:1;
  padding:13px;
  border:none;
  border-radius:30px;
  font-size:15px;
  cursor:pointer;
  transition:.3s;
}

.green{
  background:linear-gradient(135deg,var(--gold),var(--gold-dark));
  color:#000;
  font-weight:600;
}
.primary{
  background:#222;
  color:#fff;
  border:1px solid #333;
}
.orange{
  background:#444;
  color:#fff;
}
.reset{
  background:var(--danger);
  color:#fff;
}

button:hover{opacity:.9}
</style>
<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0e0e0e">
<link rel="apple-touch-icon" href="logo-192.png">

<body>
<div class="app">
  <div class="header">
    <img src="logo.png">
    <div>
      <b>Hotel Ravi Palace</b><br>
      <small>Near Taj Mahal, Agra</small>
    </div>
  </div>

  <div class="content" id="app"></div>
</div>

<script>
const WHATSAPP = "917409649313";

let booking = {
  adults:2,
  children:0,
  history:[]
};

function today(){
  return new Date().toISOString().split("T")[0];
}
function tomorrow(){
  let d=new Date(); d.setDate(d.getDate()+1);
  return d.toISOString().split("T")[0];
}

const app = document.getElementById("app");

/* STEP 1 – DATES */
function stepDates(){
  app.innerHTML = `
    <div class="card">
      <h3>Select Dates</h3>
      <label>Check-in</label>
      <input type="date" id="checkin" value="${today()}">
      <label>Check-out</label>
      <input type="date" id="checkout" value="${tomorrow()}">
      <div class="actions">
        <button class="green" onclick="stepGuests()">Next</button>
      </div>
    </div>`;
}

/* STEP 2 – GUESTS */
function stepGuests(){
  booking.checkin = checkin.value;
  booking.checkout = checkout.value;

  app.innerHTML = `
    <div class="card">
      <h3>Guests</h3>
      <label>Adults</label>
      <select id="adults">
        <option>1</option><option selected>2</option><option>3</option><option>4</option><option>5</option>
      </select>
      <label>Children</label>
      <select id="children">
        <option selected>0</option><option>1</option><option>2</option><option>3</option>
      </select>
      <div class="actions">
        <button class="primary" onclick="stepDates()">Back</button>
        <button class="green" onclick="stepRooms()">Next</button>
      </div>
    </div>`;
}

/* STEP 3 – ROOMS */
function stepRooms(){
  booking.adults = adults.value;
  booking.children = children.value;

  app.innerHTML = `
    <div class="card">
      <h3>Select Room</h3>
      <button class="green" onclick="selectRoom('Classic Room',700,2000)">Classic Room</button><br><br>
      <button class="green" onclick="selectRoom('Family Triple Suite',1200,3000)">Family Triple Suite</button><br><br>
      <button class="green" onclick="selectRoom('Presidential Family Suite',1800,3500)">Presidential Family Suite</button>
      <div class="actions">
        <button class="primary" onclick="stepGuests()">Back</button>
      </div>
    </div>`;
}

/* PRICE LOGIC – UNCHANGED */
function selectRoom(name,min,max){
  booking.room = name;
  booking.min = min;
  booking.price = min + Math.round((max-min)*0.75);
  booking.history = ["₹"+booking.price];
  showPrice();
}

function showPrice(){
  app.innerHTML = `
    <div class="card">
      <h3>${booking.room}</h3>
      <p>Best available price</p>
      <h2 style="color:#d4af37">₹${booking.price} / night</h2>
      <div class="actions">
        <button class="green" onclick="confirm()">Confirm</button>
        <button class="orange" onclick="offer()">Price looks high</button>
      </div>
    </div>`;
}

function offer(){
  booking.price = Math.round(booking.price * 0.92);
  booking.history.push("₹"+booking.price);
  askOffer();   // 👈 THIS WAS MISSING
}
function askOffer(){
  booking.offer = booking.price;

  // AI recommended price (display only – no logic impact)
  const recommended = Math.round(
    booking.min + (booking.price - booking.min) * 0.6
  );

  app.innerHTML = `
    <div class="card">
      <h3>Your Offer</h3>

      <p style="color:#d4af37;font-weight:600">
        Recommended price: ₹${recommended}
      </p>
      <small>
        AI suggests this price has the highest approval chance.
      </small>

      <input type="range"
        min="${booking.min}"
        max="${booking.price}"
        step="100"
        value="${booking.price}"
        oninput="
          offerVal.innerText=this.value;
          booking.offer=parseInt(this.value)
        ">
      
      <p style="margin-top:10px">
        Your offer: <b>₹<span id="offerVal">${booking.price}</span></b>
      </p>

      <div class="actions">
        <button class="green" onclick="submitOffer()">Submit</button>
        <button class="reset" onclick="stepDates()">Reset</button>
      </div>
    </div>
  `;
}

function submitOffer(){
  booking.history.push("₹"+booking.offer);

  if(booking.offer < booking.min){
    approval();
    return;
  }

  booking.price = booking.offer;
  confirm();
}

function approval(){
  app.innerHTML = `
    <div class="card">
      <h3>Price Approval Required</h3>
      <p style="color:#d4af37">
        You selected a price lower than our minimum.<br>
        Hotel will confirm and inform you shortly.
      </p>
      <input placeholder="Your Name" id="name">
      <input placeholder="Mobile Number" id="mobile">
      <div class="actions">
        <button class="green" onclick="send()">Continue</button>
      </div>
    </div>
  `;
}


function confirm(){
  app.innerHTML = `
    <div class="card">
      <h3>Booking Summary</h3>
      <p>${booking.room}</p>
      <p>₹${booking.price}</p>
      <div class="actions">
        <button class="green" onclick="send()">Confirm Booking</button>
        <button class="reset" onclick="stepDates()">Reset</button>
      </div>
    </div>`;
}

function send(){
  const msg = `Hotel Ravi Palace Booking
Room: ${booking.room}
Dates: ${booking.checkin} to ${booking.checkout}
Guests: ${booking.adults} Adults, ${booking.children} Children
Final Price: ₹${booking.price}

Price Attempts:
${booking.history.join(" → ")}`;

  location.href = "https://wa.me/"+WHATSAPP+"?text="+encodeURIComponent(msg);
}

/* START */
stepDates();
</script>
